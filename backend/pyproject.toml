[project]
name = "simularenda-backend"
version = "0.1.0"
description = "Backend FastAPI do SimulaRenda."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic[email]",
  "pydantic-settings",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "redis",
  "httpx",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
