[project]
name = "simularenda-backend"
version = "0.1.0"
description = "Backend FastAPI do SimulaRenda."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "nicegui>=1.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "redis>=5.0",
  "slowapi>=0.1.9",
  "plotly>=5.20",
  "reportlab>=4.1",
  "structlog>=24.0",
  "httpx>=0.27",
  "sentry-sdk[fastapi]>=2.0",
  "Argon2>=0.1.10",
  "argon2_cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "aiosqlite>=0.20",
  "anyio>=4.0",
  "playwright>=1.44",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
