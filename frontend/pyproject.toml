[project]
name = "simularenda-frontend"
version = "0.1.0"
description = "Frontend NiceGUI do SimulaRenda."
requires-python = ">=3.12"
dependencies = [
  "nicegui",
  "httpx",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
